name: Publish website and compile CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out website source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends texlive-xetex texlive-latex-extra texlive-fonts-recommended
      - name: Compile CV
        run: |
          mkdir -p _build
          xelatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error -jobname=cv -output-directory=_build CV.tex
          xelatex -no-shell-escape -interaction=nonstopmode -halt-on-error -file-line-error -jobname=cv -output-directory=_build CV.tex
          test -s _build/cv.pdf
      - name: Assemble public website
        run: |
          mkdir -p _site
          cp index.html content.js site.js styles.css robots.txt sitemap.xml .nojekyll googleda14feaa0d5c1ba4.html _site/
          cp -R ja _site/ja
          cp _build/cv.pdf _site/cv.pdf
          if [ -f portrait.jpg ]; then cp portrait.jpg _site/; fi
      - name: Upload website
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
